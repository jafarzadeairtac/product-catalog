<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JAFARZADE AIR TAC Catalogue</title>
<meta name="description" content="Product catalogue — pneumatic fittings, valves, cylinders, hoses, couplings and air preparation units.">
<meta name="theme-color" content="#211936">
<style>
:root{--indigo:#211936;--violet:#39285F;--tech:#6753A2;--lav:#B7AEC9;--silver:#D9D7E1;--off:#F4F2F7;--brass:#C49A45;--ink:#211936;--card:#fff;--line:#D9D7E1;--muted:#5d5575}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:116px}
body{margin:0;background:var(--off);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Geeza Pro",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
.fa{font-family:"Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif}
header.hero{background:var(--indigo);color:#fff;position:relative;overflow:hidden;padding:calc(28px + env(safe-area-inset-top)) 16px 30px}
header.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .in{position:relative;max-width:1200px;margin:0 auto}
.brand{font-weight:700;letter-spacing:.22em;font-size:12px;color:var(--lav);text-transform:uppercase}
.hero h1{margin:10px 0 6px;font-size:clamp(28px,8vw,44px);line-height:1.05;letter-spacing:.01em;font-weight:700}
.hero h1 span{color:var(--brass)}
.hero p{margin:0;max-width:34em;color:var(--silver);font-size:15px}
.rule{height:2px;width:56px;background:var(--brass);margin:16px 0 0}
nav.bar{position:sticky;top:0;z-index:20;background:var(--violet);padding:10px 0 8px;border-bottom:1px solid #00000033;padding-top:calc(10px + env(safe-area-inset-top))}
nav.bar .in{max-width:1200px;margin:0 auto;padding:0 16px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:0 12px;height:42px}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:transparent;color:var(--ink);min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;max-width:1200px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;color:#fff;text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid #ffffff40;border-radius:999px;white-space:nowrap}
.chips a:active,.chips a.on{background:var(--brass);border-color:var(--brass);color:var(--indigo)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 48px}
section.cat{padding-top:30px}
.cat-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--lav);padding-bottom:10px;position:relative}
.cat-h::after{content:"";position:absolute;inset-inline-start:0;bottom:-1px;width:56px;height:2px;background:var(--brass)}
.num{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--tech)}
.cat-h h2{margin:0;font-size:22px;line-height:1.2;font-weight:650;flex:1}
.cat-h .fa-t{font-size:16px;color:var(--muted);direction:rtl}
.sub{margin:22px 0 4px;font-size:14px;font-weight:650;color:var(--violet);display:flex;align-items:center;gap:8px}
.sub::before{content:"";width:18px;height:2px;background:var(--tech)}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
details.fam{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.fam[open]{border-color:var(--tech);grid-column:1/-1}
details.fam summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px;-webkit-tap-highlight-color:transparent}
details.fam summary::-webkit-details-marker{display:none}
.ph{flex:none;width:92px;height:92px;border-radius:8px;background:#fff;border:1px solid #ece9f2;display:grid;place-items:center;overflow:hidden}
.ph.two{width:auto;min-width:92px;gap:2px;grid-auto-flow:column;padding:0 4px}
.ph img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.ph.two img{max-width:88px;max-height:88px}
.ph.empty{background:repeating-linear-gradient(135deg,#f4f2f7 0 6px,#ece9f2 6px 12px)}
.ft{min-width:0;flex:1}
.ft b{display:block;font-weight:650;font-size:16px;line-height:1.35;unicode-bidi:plaintext;text-align:start}
.ft small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chev{flex:none;width:22px;height:22px;color:var(--tech);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--off);color:var(--violet);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;text-align:start;padding:8px 12px;position:sticky;top:0}
td{padding:8px 12px;border-top:1px solid #ece9f2;vertical-align:top}
td.d{unicode-bidi:plaintext;text-align:start;min-width:55%}
td.c{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;white-space:nowrap;color:var(--violet)}
tr.hide{display:none}
.mat td,.mat th{text-align:center;padding:6px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mat th:first-child,.mat td:first-child{position:sticky;inset-inline-start:0;background:var(--off);font-weight:650;color:var(--violet);z-index:1}
.mat td.y{color:var(--tech);font-weight:700}
.mat td.n{color:#bbb5c9}
.note{font-size:12.5px;color:var(--muted);margin:8px 12px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
.card .hd{display:flex;gap:12px;align-items:center;padding:10px}
.card .hd b{font-size:17px}
.dots{display:inline-flex;gap:5px;direction:ltr}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #0004;display:inline-block}
.dot.white{background:#fff;border-color:#555}
.empty-msg{display:none;margin:28px 0;text-align:center;color:var(--muted)}
footer{background:var(--indigo);color:var(--lav);padding:28px 16px calc(28px + env(safe-area-inset-bottom));font-size:13px}
footer .in{max-width:1200px;margin:0 auto}
footer b{color:#fff;letter-spacing:.18em;font-size:12px}
.top{position:fixed;inset-inline-end:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--brass);color:var(--indigo);display:none;place-items:center;text-decoration:none;box-shadow:0 4px 14px #0004;z-index:30}
mark{background:#C49A4540;color:inherit;border-radius:2px}

@media print{
 @page{size:A4;margin:14mm 12mm}
 body{background:#fff;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 nav.bar,.top,.empty-msg,footer a{display:none!important}
 header.hero{padding:18px 16px 20px;break-after:avoid}
 section.cat{break-before:page;padding-top:0}
 section.cat:first-of-type{break-before:auto}
 .grid{display:block}
 details.fam,.card{break-inside:auto;margin-top:10px}
 details.fam summary{break-after:avoid}
 .chev{display:none}
 .ph{width:70px;height:70px}
 .ph.two{min-width:70px}
 .ph.two img{max-width:66px;max-height:66px}
 tr{break-inside:avoid}
 thead{display:table-header-group}
 th{position:static}
 td{padding:4px 10px;font-size:10.5px}
 .tw{overflow:visible}
 .mat td,.mat th{padding:3px 5px;font-size:9.5px}
}

html[lang=fa] body,html[lang=fa] input,html[lang=fa] button{font-family:"Vazirmatn","Noto Sans Arabic","Geeza Pro",Tahoma,"Segoe UI",system-ui,sans-serif}
html[dir=rtl] .chev{transform:scaleX(-1)}
html[dir=rtl] details[open] .chev{transform:scaleX(-1) rotate(90deg)}
html[lang=fa] .hero h1{letter-spacing:0;line-height:1.25}
html[lang=fa] .brand{letter-spacing:.18em}
html[lang=fa] th{letter-spacing:0;text-transform:none}
.lang{flex:none;border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:10px;height:42px;padding:0 14px;font:600 14px/1 system-ui,sans-serif;cursor:pointer}
.lang:active{background:var(--brass);color:var(--indigo);border-color:var(--brass)}
.srow{display:flex;gap:8px}.srow .search{flex:1;min-width:0}
td.c{text-align:left!important}
@media print{.lang{display:none}}

@media(min-width:720px){
 body{font-size:16px}
 header.hero{padding-top:56px;padding-bottom:56px}
 .hero p{font-size:17px}
 .chips a{font-size:14px;padding:7px 14px}
 .chips a:hover{background:#ffffff1f}
 html{scroll-padding-top:90px}
 .cat-h h2{font-size:28px}
 .ph{width:104px;height:104px}
 details.fam summary:hover{background:#faf9fc}
 td,th{padding:10px 16px}
}
@media(min-width:1040px){
 nav.bar .in{display:flex;gap:12px;align-items:center}
 nav.bar{display:flex;align-items:center;gap:16px;padding:10px 0}
 nav.bar>.in,nav.bar>.chips{max-width:none}
 .srow{flex:0 0 380px;padding:0 0 0 max(16px,calc((100vw - 1200px)/2))}
 html[dir=rtl] .srow{padding:0 max(16px,calc((100vw - 1200px)/2)) 0 0}
 .chips{flex:1;flex-wrap:wrap;overflow:visible;padding:0 max(16px,calc((100vw - 1200px)/2)) 0 0;margin:0}
 html[dir=rtl] .chips{padding:0 0 0 max(16px,calc((100vw - 1200px)/2))}
}
@media(min-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:720px){header.hero .in,main,footer .in{max-width:1200px}}
@media(min-width:720px){.cardlist{display:grid}}

footer{padding-top:36px;border-top:3px solid var(--brass)}
.fgrid{display:grid;gap:26px;grid-template-columns:1fr}
@media(min-width:720px){.fgrid{grid-template-columns:1.2fr 1fr;gap:48px}}
footer .wm{color:#fff;letter-spacing:.2em;font-size:13px}
html[lang=fa] footer .wm{letter-spacing:0;font-size:17px}
.tel{color:#fff;text-decoration:none;line-height:2;font-variant-numeric:tabular-nums}
footer p{margin:10px 0 0;line-height:1.7}
.fcontact{display:grid;gap:14px;align-content:start}
.fc{display:flex;gap:12px;align-items:flex-start;color:#fff;text-decoration:none}
.fc svg{flex:none;width:20px;height:20px;margin-top:2px;color:var(--brass)}
.fc small{display:block;color:var(--lav);font-size:12px;letter-spacing:.04em}
.fc span{display:block;line-height:1.6;unicode-bidi:plaintext}
.fc .ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:30px;padding-top:20px;border-top:1px solid #ffffff22}
.seg{display:inline-flex;background:#ffffff14;border:1px solid #ffffff30;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--silver);font:600 14px/1 system-ui,sans-serif;padding:10px 20px;border-radius:999px;cursor:pointer;min-width:92px}
.seg button.on{background:var(--brass);color:var(--indigo)}
.pdfl{color:var(--brass);text-decoration:none;font-weight:600;border-bottom:1px solid #C49A4580;padding-bottom:2px}
.credit{margin-top:22px!important;font-size:12.5px;color:var(--lav);text-align:center}
.credit:empty{display:none}
@media print{.seg,.pdfl{display:none}}

.down{position:fixed;inset-inline-end:14px;bottom:calc(66px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--indigo);color:#fff;border:2px solid var(--brass);display:none;place-items:center;text-decoration:none;box-shadow:0 4px 14px #0004;z-index:30}
@media print{.down{display:none!important}}

/* hero actions */
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--brass);color:var(--indigo)}
.btn.sec{border-color:#ffffff40;color:#fff;background:#ffffff0d}
.btn.pri:hover{background:#d3ab5a}.btn.sec:hover{background:#ffffff1f}
.btn .ltr{direction:ltr;unicode-bidi:isolate}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;color:var(--lav);font-size:13px}
.stats b{color:#fff;font-size:20px;font-weight:700;margin-inline-end:6px;font-variant-numeric:tabular-nums}
/* search */
.search .clr{flex:none;border:0;background:#ece9f2;color:var(--violet);width:26px;height:26px;border-radius:50%;display:none;place-items:center;cursor:pointer;padding:0}
.search.has .clr{display:grid}
.search input::-webkit-search-cancel-button{display:none}
.count{max-width:1200px;margin:14px auto 0;padding:0 16px;color:var(--muted);font-size:13.5px;display:none}
.count.on{display:block}
/* category header count */
.cat-h .cnt{flex:none;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
/* photo frame: whole product, never cropped */
.ph{padding:3px;cursor:zoom-in;position:relative;transition:border-color .15s}
.ph.empty{cursor:default}
.ph img{width:auto;height:auto;max-width:100%;max-height:100%}
.ph:not(.empty):hover{border-color:var(--lav)}
.ph .zm{position:absolute;inset-inline-end:3px;bottom:3px;width:20px;height:20px;border-radius:6px;background:#211936b3;color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .15s}
.ph:hover .zm{opacity:1}
@media(hover:none){.ph .zm{opacity:.85}}
.ph .zm svg{width:12px;height:12px}
/* code copy */
td.c{cursor:copy;user-select:all}
td.c:hover{color:var(--tech);background:#f6f4fa}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--indigo);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;border-inline-start:3px solid var(--brass)}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* lightbox */
dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,820px);width:100%;max-height:92vh;overflow:visible}
dialog.lb::backdrop{background:#211936e6}
.lb .box{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;max-height:92vh}
.lb .pics{display:flex;gap:10px;justify-content:center;align-items:center;padding:20px;background:#fff;min-height:200px;flex:1;overflow:auto}
.lb .pics img{width:100%;height:min(62vh,460px);object-fit:contain}
.lb .pics.two img{width:48%}
.lb .cap{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:var(--off)}
.lb .cap b{flex:1;font-size:16px;unicode-bidi:plaintext;text-align:start}
.lb .x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--violet);display:grid;place-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted);margin:8px 12px 12px}
.legend .y{color:var(--tech);font-weight:700}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.search:focus-within{box-shadow:0 0 0 2px var(--brass)}
.search input:focus-visible{outline:0}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.cta,.count,.zm,.toast,dialog{display:none!important}.ph{padding:2px;cursor:default}td.c{cursor:auto}}
</style>
</head>
<body>
<header class="hero">
<svg class="bg" viewBox="0 0 960 300" preserveAspectRatio="xMaxYMid slice" fill="none" stroke="#6753A2" stroke-width="1.2" aria-hidden="true">
 <path d="M300 70H520V150H700M520 150V230H820M700 150V60H900" opacity=".55"/>
 <path d="M360 40V70M560 40V70" opacity=".4"/>
 <g opacity=".75"><rect x="560" y="132" width="36" height="36"/><path d="M560 132l36 36M596 132l-36 36" opacity=".5"/><path d="M820 218l14 12-14 12" stroke="#C49A45"/></g>
 <path d="M640 260H940M700 280H900" opacity=".3"/>
 <g opacity=".5"><path d="M430 190v30h40v-30z"/><path d="M450 190v-18"/><circle cx="450" cy="166" r="6"/></g>
</svg>
<div class="in">
 <div class="brand">JAFARZADE · AIR TAC</div>
 <h1 id="h1"></h1>
 <p id="sub"></p>
 <div class="rule"></div>
 <div class="stats" id="stats"></div>
 <div class="cta" id="cta"></div>
</div>
</header>
<nav class="bar">
 <div class="in srow"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6753A2" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search products"><button type="button" class="clr" id="clr" aria-label="Clear"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></label></div>
 <div class="chips" id="chips"></div>
</nav>
<p class="count" id="count" aria-live="polite"></p>
<main id="app"></main>
<p class="empty-msg" id="none"></p>
<footer id="footer">
<div class="in">
 <div class="fgrid">
  <div class="fbrand"><b class="wm">JAFARZADE · AIR TAC</b><p id="fnote"></p></div>
  <div class="fcontact" id="fcontact"></div>
 </div>
 <div class="fbar">
  <div class="seg" role="group" aria-label="Language"><button type="button" data-l="fa" class="fa">فارسی</button><button type="button" data-l="en">English</button></div>
  <a id="pdf" class="pdfl"></a>
 </div>
 <p class="credit" id="credit"></p>
</div></footer>
<a class="down" id="down" href="#footer" aria-label="Jump to footer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></a>
<dialog class="lb" id="lb"><div class="box"><div class="pics" id="lbp"></div><div class="cap"><b id="lbt"></b><button type="button" class="x" id="lbx" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div></dialog>
<div class="toast" id="toast" role="status"></div>
